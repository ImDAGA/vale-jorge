<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vale &amp; Jorge — Sube tus fotos</title>
<meta name="description" content="Comparte con Vale y Jorge las fotos y videos que tomaste en su matrimonio.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #3a4335;
    --sage: #8a906e;
    --cream: #efe9de;
  }
  * { box-sizing: border-box; }
  html { overflow-x: hidden; background: var(--dark); }
  body {
    margin: 0;
    background: var(--dark);
    font-family: 'Spectral', serif;
    color: var(--cream);
  }

  /* Tarjeta: todas las medidas del marco están en proporción al ancho (diseño base de 612 unidades). */
  .wrap {
    container-type: inline-size;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
  }
  .card {
    --u: calc(100cqw / 612);
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(88 * var(--u)) 11% calc(80 * var(--u));
    text-align: center;
  }

  .frame { position: absolute; display: block; pointer-events: none; }
  .frame--sup  { left: 11.4%; right: 11.7%; top: calc(13.2 * var(--u)); height: calc(9.1 * var(--u)); }
  .frame--inf  { left: 11.8%; right: 11%;   bottom: calc(13.2 * var(--u)); height: calc(7.7 * var(--u)); }
  .frame--izq  { left: calc(10.6 * var(--u)); width: calc(6.8 * var(--u)); top: calc(95.5 * var(--u)); height: calc(100% - 185 * var(--u)); }
  .frame--der  { right: calc(10.9 * var(--u)); width: calc(6.1 * var(--u)); top: calc(79.6 * var(--u)); height: calc(100% - 171.8 * var(--u)); }
  .frame--tl { left: calc(12.1 * var(--u)); top: calc(14.4 * var(--u)); width: calc(44.2 * var(--u)); }
  .frame--tr { right: calc(10.6 * var(--u)); top: calc(13.5 * var(--u)); width: calc(53.7 * var(--u)); }
  .frame--bl { left: calc(11 * var(--u)); bottom: calc(13.3 * var(--u)); width: calc(46.7 * var(--u)); }
  .frame--br { right: calc(13.1 * var(--u)); bottom: calc(14.6 * var(--u)); width: calc(47.3 * var(--u)); }

  .titulo { display: block; width: 100%; height: auto; margin: 0 auto; }
  .camara { display: block; width: 100%; flex: none; height: auto; margin: calc(44 * var(--u)) auto 0; }

  .texto {
    width: 100%;
    margin: calc(52 * var(--u)) auto 0;
    font-size: clamp(16px, 4.3vw, 20px);
    line-height: 1.55;
    letter-spacing: 0.02em;
    text-align: left;
  }

  .btn {
    display: inline-block;
    margin-top: calc(34 * var(--u));
    font-family: 'Spectral', serif;
    font-size: clamp(14px, 3.6vw, 16px);
    font-weight: 500;
    letter-spacing: 0.1em;
    text-decoration: none;
    color: var(--dark);
    background: var(--cream);
    padding: 18px clamp(28px, 7vw, 40px);
    border-radius: 999px;
  }
  .btn:active { opacity: 0.85; }

  @media (min-width: 600px) {
    .wrap { padding: 24px 0; }
    .card { min-height: calc(100svh - 48px); }
  }
</style>
</head>
<body>
<main class="wrap">
<div class="card">
  <img class="frame frame--sup" src="/assets/pov-marco-sup.svg" alt="">
  <img class="frame frame--inf" src="/assets/pov-marco-inf.svg" alt="">
  <img class="frame frame--izq" src="/assets/pov-marco-izq.svg" alt="">
  <img class="frame frame--der" src="/assets/pov-marco-der.svg" alt="">
  <img class="frame frame--tl" src="/assets/pov-marco-esq-tl.svg" alt="">
  <img class="frame frame--tr" src="/assets/pov-marco-esq-tr.svg" alt="">
  <img class="frame frame--bl" src="/assets/pov-marco-esq-bl.svg" alt="">
  <img class="frame frame--br" src="/assets/pov-marco-esq-br.svg" alt="">

  <h1 style="margin:0;width:92%">
    <img class="titulo" src="/assets/pov-titulo.svg" alt="¡Queremos ver el matri desde sus ojos!">
  </h1>
  <img class="camara" src="/assets/pov-camara.svg" alt="Cámara de fotos y cámara de video con la palabra POV">

  <p class="texto">¿Sacaste fotos o videos durante la noche? Súbelos acá para que podamos guardarlos todos. Las lindas, las borrosas, las espontáneas, todas. Nos van a ayudar a acordarnos de la mejor noche de nuestras vidas.</p>

  <a class="btn" href="https://drive.google.com/drive/folders/1suzOyYF0R5edQG1T4gZUS-98JVmAGWFr?usp=sharing" target="_blank" rel="noopener">SUBIR FOTOS Y VIDEOS</a>
</div>
</main>
</body>
</html>
